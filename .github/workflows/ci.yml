name: CI

# CI remoto desligado por enquanto — rode `pnpm ci:local` antes de abrir PR.
# Mantido como `workflow_dispatch` para reativar via "Run workflow" sem reescrever.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yukilabs/agnostic-ui-next gen:di:check
      - run: pnpm turbo run lint typecheck test build
      # Drift do contrato: Zod → JSON Schema (ADR 0005). O schema→Dart é checado
      # no job `dart`. Espelha o gen:di:check.
      - run: pnpm --filter @yukilabs/agnostic-ui-core gen:schema:check
      # Sincronia dos 3 registries de artefato TS↔Dart (ADR 0006 §8, H6).
      - run: pnpm run artifacts:check
      # Gate de divergência cross-renderer (ADR 0006 §8): os 3 runners cobrem o
      # corpus e os renderers concordam com cada vetor. Exige o build acima.
      - run: pnpm run conformance:check

  # Pipeline Dart/Flutter da frente nativa (ADR 0005) — toolchain separada do
  # pnpm, mesmo repo. Espelha `pnpm dart:ci`.
  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub global activate melos
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: melos run analyze
      # Drift do contrato: JSON Schema → modelos Dart (espelha gen:di:check).
      - run: melos run generate:check
      - run: melos run test
