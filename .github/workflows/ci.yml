name: CI

# CI remoto desligado por enquanto — rode `pnpm ci:local` antes de abrir PR.
# Mantido como `workflow_dispatch` para reativar via "Run workflow" sem reescrever.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build
