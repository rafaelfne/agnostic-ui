# Raiz do workspace Dart (pub workspaces nativos, Dart >= 3.6) — orquestra os
# três pacotes da frente nativa (ADR 0005 §3). Não publicado. `flutter pub get`
# aqui resolve todos os membros; `melos` (config na seção `melos:` abaixo, padrão
# melos 8) provê os scripts agregados que o Turbo dispara no CI.
name: agnostic_ui_workspace
publish_to: none

environment:
  sdk: ^3.6.0

dev_dependencies:
  melos: ^8.0.0

workspace:
  - packages/agnostic_ui_contract
  - packages/agnostic_ui_flutter
  - packages/agnostic_ui_sdk

melos:
  scripts:
    analyze:
      description: Análise estática (fatal em infos) de todos os pacotes.
      exec: dart analyze --fatal-infos .

    test:
      description: Testes de todos os pacotes — `dart test` nos puros, `flutter test` nos Flutter.
      run: >-
        melos exec --no-flutter --concurrency=1 -- dart test &&
        melos exec --flutter --concurrency=1 -- flutter test
